<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5C518">
<meta name="robots" content="noindex">
<title>Niger Area Control Room</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;gap:2px;min-width:0}
  .kpi b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .cols{display:flex;align-items:flex-end;gap:2px;height:140px;padding-top:18px;position:relative;border-bottom:1px solid var(--line)}
  .cols .c{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative;cursor:default}
  .cols .c i{display:block;width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
  .cols .c:hover i,.cols .c:focus i{background:var(--green-deep)}
  .cols .c .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12px;padding:3px 7px;border-radius:4px;white-space:nowrap;display:none;z-index:2;pointer-events:none}
  .cols .c:hover .tip,.cols .c:focus .tip{display:block}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .hbar{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:3px 0}
  .hbar .t{height:10px;background:var(--sunk);border-radius:0 4px 4px 0;overflow:hidden}
  .hbar .t i{display:block;height:100%;background:var(--green);border-radius:0 4px 4px 0}
  .hbar.neg .t i{background:var(--muted)}
  details summary{cursor:pointer;font-size:13px;color:var(--muted)}
  .flag-row{border-left:4px solid var(--bad);padding-left:10px}
</style>
</head>
<body>
<div id="app"><div class="setup"><span class="stamp">Loading</span><h1>Control room</h1></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
