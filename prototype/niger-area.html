<title>Niger Area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: danfo-yellow status bar over a ballot-paper app shell; sections as a ticket strip of tabs */
:root{
  --paper:#EEF1E8; --surface:#FFFFFF; --sunk:#E3E8DC; --ink:#132019; --muted:#56675D; --line:#D0D8C8;
  --green:#0B6B3B; --on-green:#FFFFFF; --danfo:#F4C21B; --on-danfo:#15130A;
  --good:#1E7A45; --warn:#9A6100; --bad:#B53A22;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0D1410; --surface:#15201A; --sunk:#1C2A22; --ink:#E6EEE4; --muted:#93A399; --line:#2A3A31;
  --green:#2E9E63; --on-green:#07130C; --danfo:#F4C21B; --on-danfo:#15130A;
  --good:#4CC181; --warn:#E3A83A; --bad:#EB6C52; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0D1410; --surface:#15201A; --sunk:#1C2A22; --ink:#E6EEE4; --muted:#93A399; --line:#2A3A31;
  --green:#2E9E63; --on-green:#07130C; --danfo:#F4C21B; --on-danfo:#15130A;
  --good:#4CC181; --warn:#E3A83A; --bad:#EB6C52; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* Top bar: the danfo */
.bus{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--danfo);color:var(--on-danfo);
  border-bottom:6px solid var(--on-danfo);box-shadow:0 5px 0 -1px var(--danfo) inset}
.bus::after{content:"";display:block;height:5px;background:repeating-linear-gradient(90deg,var(--on-danfo) 0 22px,var(--danfo) 22px 30px)}
.bus-in{max-width:1040px;margin:0 auto;padding:10px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.14em;opacity:.75}
.meters{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto;align-items:center}
.meter{display:flex;flex-direction:column;line-height:1.1}
.meter b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.meter span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.7}
.endday{background:var(--on-danfo);color:var(--danfo);border:0;border-radius:4px;padding:9px 14px;font-weight:800;cursor:pointer;
  font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.endday:hover{filter:brightness(1.3)}
.ticker{max-width:1040px;margin:0 auto;padding:0 16px 8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker em{font-style:normal;background:var(--on-danfo);color:var(--danfo);padding:1px 6px;margin-right:8px;font-size:11px;letter-spacing:.1em;border-radius:2px}

/* Tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--danfo);outline-offset:2px}

h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:28px;font-weight:800}
h3{font-size:19px;font-weight:800}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch}
.sec{display:grid;gap:14px;margin-top:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid3{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px;min-width:0;align-content:start}
.panel.hero{border-color:var(--green);border-width:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.btn{border:1px solid var(--ink);background:transparent;padding:7px 12px;border-radius:4px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--green)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.42;cursor:not-allowed}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:7px 10px;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pill-good{color:var(--good);border-color:currentColor}
.pill-warn{color:var(--warn);border-color:currentColor}
.pill-bad{color:var(--bad);border-color:currentColor}

.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.bar.g i{background:var(--good)}.bar.w i{background:var(--warn)}.bar.b i{background:var(--bad)}
.stat{display:grid;grid-template-columns:120px 1fr 38px;gap:10px;align-items:center;font-size:14px}

.list{display:grid;gap:0}
.li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li > div{min-width:0}

.action{display:grid;gap:6px;border:1px solid var(--line);border-radius:5px;padding:12px;background:var(--paper)}
.action b{font-size:14px}
.action p{margin:0;font-size:13px;color:var(--muted)}

.ballot{display:grid;gap:8px}
.cand{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.cand .bar{grid-column:1/-1}
.cand.me{background:color-mix(in srgb,var(--danfo) 22%,transparent);margin-inline:-8px;padding:6px 8px;border-radius:4px}

.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.news .li{justify-content:flex-start;flex-wrap:nowrap;align-items:baseline}
.news .d{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;width:56px}

/* Setup */
.setup{max-width:560px;margin:28px auto 0;display:grid;gap:16px}
.setup h1{font-size:clamp(44px,11vw,84px);font-weight:900;line-height:.9}
.setup .stamp{display:inline-block;background:var(--green);color:var(--on-green);font-family:var(--display);font-weight:800;padding:2px 10px;font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.feature{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px;font-size:13px}
.feature div{border-left:3px solid var(--danfo);padding:2px 0 2px 10px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(5,10,7,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:8px;max-width:460px;width:100%;padding:20px;display:grid;gap:12px;border-top:8px solid var(--danfo);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:5px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.adbox{height:120px;border-radius:6px;display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--sunk) 0 14px,var(--paper) 14px 28px);font-weight:700}
@media (max-width:560px){ .brand{font-size:24px} .stat{grid-template-columns:92px 1fr 34px} .big{font-size:28px} }
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .25s ease-out} @keyframes up{from{transform:translate(-50%,10px);opacity:0}} }
</style>

<div id="app"></div>

<script>
/* ============ DATA ============ */
const STATES=[
 {id:'lagos',name:'Lagos',lgas:['Ikeja','Surulere','Alimosho']},
 {id:'kano',name:'Kano',lgas:['Nassarawa','Fagge','Dala']},
 {id:'rivers',name:'Rivers',lgas:['Obio-Akpor','Port Harcourt','Bonny']},
 {id:'enugu',name:'Enugu',lgas:['Nsukka','Enugu North','Udi']},
 {id:'oyo',name:'Oyo',lgas:['Ibadan North','Ogbomosho','Iseyin']},
 {id:'kaduna',name:'Kaduna',lgas:['Zaria','Kaduna South','Kafanchan']},
 {id:'fct',name:'Abuja FCT',lgas:['AMAC','Bwari','Gwagwalada']}
];
const PARTIES=[
 {id:'pbc',name:'Progressive Broom Congress',abbr:'PBC',color:'#1F8A55',members:4200000},
 {id:'pup',name:"People's Umbrella Party",abbr:'PUP',color:'#D2412F',members:3600000},
 {id:'lv',name:'Labour Vanguard',abbr:'LV',color:'#3478C4',members:2100000},
 {id:'npm',name:'New Progressives Movement',abbr:'NPM',color:'#B07A18',members:1300000}
];
const OFF={
 LG:{title:'LG Chairman',term:30,fee:2000,salary:300,alloc:40000,unit:6000,voters:[60000,180000],minRep:0,cap:8000,mult:1},
 SEN:{title:'Senator',term:60,fee:5000,salary:500,alloc:60000,unit:9000,voters:[800000,2000000],minRep:8,cap:20000,mult:2},
 GOV:{title:'Governor',term:60,fee:8000,salary:800,alloc:150000,unit:20000,voters:[1000000,3000000],minRep:15,cap:40000,mult:3},
 PRES:{title:'President',term:120,fee:20000,salary:1500,alloc:600000,unit:90000,voters:[18000000,25000000],minRep:30,cap:120000,mult:6}
};
const STATS=[['roads','Roads'],['power','Power'],['health','Health'],['edu','Education'],['security','Security'],['economy','Economy']];
const PROJECTS=[
 {id:'road',stat:'roads',label:'Fix the roads',blurb:'Patch potholes, grade the feeder roads.',days:3},
 {id:'power',stat:'power',label:'Install transformers',blurb:'So people can switch off their generators.',days:2},
 {id:'health',stat:'health',label:'Equip health centres',blurb:'Drugs, beds and nurses that stay.',days:3},
 {id:'edu',stat:'edu',label:'Renovate schools',blurb:'Roofs, desks and teachers paid on time.',days:3},
 {id:'security',stat:'security',label:'Fund community security',blurb:'Vigilante patrols and police logistics.',days:2},
 {id:'economy',stat:'economy',label:'Grants for traders',blurb:'Soft loans for market women and artisans.',days:2}
];
const CAMPAIGN=[
 {id:'rally',label:'Hold a rally',blurb:'Canopies, a DJ and a wide stage.',cost:300,e:1,pop:[2,5]},
 {id:'posters',label:'Posters and radio jingles',blurb:'Your face on every electric pole.',cost:600,e:1,pop:[3,6]},
 {id:'influencers',label:'Pay influencers',blurb:'Trending by evening. Can backfire.',cost:1200,e:1,pop:[4,9],risk:true},
 {id:'debate',label:'Televised debate',blurb:'Free, costs 2 energy. You can flop.',cost:0,e:2,pop:[-3,8],integ:2},
 {id:'ruler',label:'Visit the traditional ruler',blurb:'Needs reputation 10 to get an audience.',cost:2000,e:1,pop:[5,9],needRep:10},
 {id:'rice',label:'Share bags of rice',blurb:'"Stomach infrastructure". Raises scandal.',cost:2500,e:1,pop:[7,12],scandal:10},
 {id:'buy',label:'Buy votes at polling units',blurb:'Works. EFCC is watching.',cost:5000,e:1,pop:[12,18],scandal:22,integ:-8}
];
const HOUSES=[['Room in a face-me-I-face-you',0],['Self-contain',3000],['2-bedroom flat',8000],['Bungalow',15000],['Duplex in Lekki',35000],['Mansion in Maitama',80000]];
const CARS=[['Legs and danfo',0],['Okada',1500],['Keke NAPEP',3500],['Tokunbo Corolla',9000],['Prado jeep',25000],['G-Wagon convoy',60000]];
const BIZ=[{id:'pos',label:'POS stand',cost:2000,inc:60,inf:1},{id:'shop',label:'Provision shop',cost:6000,inc:180,inf:2},{id:'station',label:'Filling station',cost:25000,inc:700,inf:5}];
const EVENTS=[
 {t:'Fuel scarcity grips Niger Area. Queues stretch for kilometres.',eff:{economy:-4},scope:'all'},
 {t:'The national grid collapses again.',eff:{power:-6},scope:'all'},
 {t:'ASUU declares an indefinite strike.',eff:{edu:-6},scope:'all'},
 {t:'Flooding sweeps through {s}.',eff:{roads:-8,economy:-3},scope:'state'},
 {t:'Kidnappers strike on the {s} highway.',eff:{security:-8},scope:'state'},
 {t:'The naira slides at the parallel market.',eff:{economy:-3},scope:'all'},
 {t:'Cholera outbreak reported in {s}.',eff:{health:-7},scope:'state'},
 {t:'Bumper harvest lifts markets across {s}.',eff:{economy:5},scope:'state'},
 {t:'Oil prices rise. Next federal allocation will be bigger.',eff:{},scope:'all',alloc:1.25}
];
const FIRST=['Chinedu','Aisha','Tunde','Ngozi','Ibrahim','Funmi','Emeka','Hauwa','Segun','Amaka','Musa','Bola','Obinna','Zainab','Kunle','Ifeoma','Yakubu','Titi','Nnamdi','Halima','Dapo','Adaeze','Sani','Kemi','Tamuno','Ebi'];
const LAST=['Okafor','Bello','Adeyemi','Nwosu','Abubakar','Ogunleye','Eze','Danjuma','Balogun','Okonkwo','Yusuf','Adebayo','Obi','Lawal','Uche','Garba','Akande','Ibe','Briggs','Amadi'];
const HONS=['Chief','Alhaji','Hon.','Dr.','Barr.','Otunba','Mallam','Engr.'];

/* ============ HELPERS ============ */
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), fmt=n=>Math.round(n).toLocaleString('en-NG');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person=()=>pick(FIRST)+' '+pick(LAST), politician=()=>pick(HONS)+' '+person();
const st=id=>STATES.find(s=>s.id===id);
const typeOf=k=>k.split(':')[0];
function allKeys(){const k=['PRES'];STATES.forEach(s=>{k.push('SEN:'+s.id);if(s.id!=='fct')k.push('GOV:'+s.id);s.lgas.forEach((_,i)=>k.push('LG:'+s.id+':'+i));});return k;}
function place(k){const [t,s,l]=k.split(':');if(t==='PRES')return 'Niger Area';const x=st(s);return t==='LG'?x.lgas[+l]+' LGA':x.name+(t==='SEN'?' District':' State');}
function officeName(k){return OFF[typeOf(k)].title+(typeOf(k)==='PRES'?' of Niger Area':', '+place(k));}
function party(id){return S.parties.find(p=>p.id===id);}
function strength(id){const t=S.parties.reduce((a,p)=>a+p.members,0);const p=party(id);return p?p.members/t*100:0;}
function chip(id){const p=party(id);if(!p)return '<span class="chip">Independent</span>';return `<span class="chip"><span class="dot" style="background:${p.color}"></span>${esc(p.abbr)}</span>`;}
function approval(k){const j=S.jur[k];const b=STATS.reduce((a,[s])=>a+j[s],0)/STATS.length;return clamp(Math.round(b+j.mood),0,100);}
function tone(v){return v>=60?'g':v>=35?'w':'b';}
function bar(v){return `<div class="bar ${tone(v)}"><i style="width:${clamp(v,0,100)}%"></i></div>`;}
const STATUS_CAP=20;
function statusRaw(){const p=S.player;return p.house*4+p.car*3+(p.gen?2:0)+(p.borehole?2:0)+(p.spouse?3:0)+p.kids+p.biz.pos*1+p.biz.shop*2+p.biz.station*5+(p.partyRole==='chair'?5:0)+p.giftInf;}
function status(){return Math.min(STATUS_CAP,Math.floor(statusRaw()));}
function repu(){return Math.floor(S.player.rep);}
function influence(){return status()+repu()+S.player.officesHeld*6;}
function addRep(d){S.player.rep=Math.max(0,S.player.rep+d);}
function migrate(p){p.rep??=0;p.cp??=0;p.sentDay??=0;p.sentToday??=0;p.redeemLog??=[];return p;}
function news(t){S.news.unshift({d:S.day,t});S.news.length=Math.min(S.news.length,60);}
function myKeys(){const p=S.player;const k=['PRES','SEN:'+p.stateId];if(p.stateId!=='fct')k.push('GOV:'+p.stateId);k.push('LG:'+p.stateId+':'+p.lga);return k.reverse();}

/* ============ STATE ============ */
let S=null, UI={tab:'wallet',modal:null,adTimer:null,toast:null};
const KEY='nigerArea.v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.player?s:null;}catch(e){return null;}}

function weightedParty(){const t=S.parties.reduce((a,p)=>a+(p.isPlayer?0:p.members),0);let r=Math.random()*t;for(const p of S.parties){if(p.isPlayer)continue;r-=p.members;if(r<=0)return p.id;}return S.parties[0].id;}
function makeElection(k,day){
  const inc=S.offices[k];const cands=[];
  if(inc&&!inc.isPlayer&&Math.random()<0.6)cands.push({name:inc.name,partyId:inc.partyId,pop:R(30,50)});
  const used=new Set(cands.map(c=>c.partyId));
  const pool=S.parties.filter(p=>!p.isPlayer&&!used.has(p.id)).sort(()=>Math.random()-.5);
  while(cands.length<3&&pool.length){const p=pool.shift();cands.push({name:politician(),partyId:p.id,pop:R(18,42)});}
  S.elections[k]={day,cands};
}
function newGame(name,stateId,lga){
  S={v:1,day:1,allocBoost:1,rate:250,inecChair:'Prof. '+person(),
    player:{name,stateId,lga:+lga,coins:1500,stash:0,energy:6,integrity:50,scandal:0,partyId:null,partyRole:null,office:null,race:null,inec:false,
      claimedDay:0,adsDay:0,adsCount:0,house:0,car:0,gen:false,borehole:false,spouse:false,kids:0,biz:{pos:0,shop:0,station:0},giftInf:0,officesHeld:0,sent:0,rep:0,cp:0,sentDay:0,sentToday:0,redeemLog:[]},
    parties:PARTIES.map(p=>({...p})),npcs:[],offices:{},elections:{},jur:{},projects:[],news:[],results:[],pending:[],lastSalary:{}};
  for(let i=0;i<30;i++)S.npcs.push({id:'n'+i,name:person(),coins:RI(2000,90000),partyId:weightedParty(),stateId:pick(STATES).id});
  const range={LG:[6,20],SEN:[12,40],GOV:[18,55],PRES:[45,45]};
  allKeys().forEach(k=>{
    const t=typeOf(k);const j={mood:0,treasury:Math.round(OFF[t].alloc*R(.3,.8)),debt:0};
    STATS.forEach(([s])=>j[s]=RI(22,58));S.jur[k]=j;
    S.offices[k]={name:politician(),partyId:weightedParty(),isPlayer:false,until:RI(...range[t])};
  });
  S.offices['LG:'+stateId+':'+lga].until=7;
  allKeys().forEach(k=>makeElection(k,S.offices[k].until));
  news(`Welcome to Niger Area, ${name}. You are a registered citizen of ${st(stateId).lgas[lga]}, ${st(stateId).name}.`);
  news(`INEC fixes the ${place('LG:'+stateId+':'+lga)} chairmanship election for Day 7.`);
}

/* ============ SIMULATION ============ */
function applyEff(keys,eff){keys.forEach(k=>{const j=S.jur[k];for(const s in eff)j[s]=clamp(j[s]+eff[s],0,100);});}
function stateKeys(sid){return allKeys().filter(k=>k.split(':')[1]===sid);}

function installPlayer(k){
  const p=S.player;
  if(p.office&&p.office!==k){S.offices[p.office]={name:politician(),partyId:p.partyId,isPlayer:false,until:S.offices[p.office].until};news(`Your deputy is sworn in as ${officeName(p.office)}.`);}
  S.offices[k]={name:p.name,partyId:p.partyId,isPlayer:true,until:S.day+OFF[typeOf(k)].term};
  p.office=k;p.officesHeld++;addRep(8);p.cp+=500;S.lastSalary[k]=S.day;S.jur[k].mood=10;
  if(p.partyId)party(p.partyId).members+=OFF[typeOf(k)].mult*150000;
  makeElection(k,S.day+OFF[typeOf(k)].term);
}
function resolveElection(k){
  const e=S.elections[k],t=typeOf(k),p=S.player;
  const turnout=Math.round(R(...OFF[t].voters)*R(.28,.42));
  const w=e.cands.map(c=>Math.max(1,c.pop+strength(c.partyId)*(t==='PRES'?.6:.35)+R(0,14)+(c.rigged?18:0)));
  const sum=w.reduce((a,b)=>a+b,0);
  const rows=e.cands.map((c,i)=>({name:c.name,partyId:c.partyId,isPlayer:!!c.isPlayer,votes:Math.round(w[i]/sum*turnout)})).sort((a,b)=>b.votes-a.votes);
  const win=rows[0];const wasMine=p.office===k;
  S.results.unshift({day:S.day,k,rows,turnout});S.results.length=Math.min(S.results.length,30);
  news(`INEC declares ${win.name} (${party(win.partyId)?.abbr||'IND'}) winner of the ${officeName(k)} election with ${fmt(win.votes)} votes.`);
  if(win.isPlayer){installPlayer(k);}
  else{
    S.offices[k]={name:win.name,partyId:win.partyId,isPlayer:false,until:S.day+OFF[t].term};
    const wp=party(win.partyId);if(wp)wp.members+=OFF[t].mult*60000;
    if(wasMine){p.office=null;news(`You hand over as ${officeName(k)}.`);}
    if(t==='PRES'){if(Math.random()<.5){if(p.inec){p.inec=false;news('The new President relieves you of your appointment as INEC Chairman.');}S.inecChair='Prof. '+person();}}
    makeElection(k,S.day+OFF[t].term);
  }
  const mine=rows.find(r=>r.isPlayer);
  if(mine){p.race=null;const margin=(win.votes-mine.votes)/turnout;
    S.pending.push({type:'result',k,rows,won:win.isPlayer});
    if(!win.isPlayer&&margin<.1)S.pending.push({type:'tribunal',k,margin,winner:win.name});}
}
function endDay(){
  const p=S.player;S.day++;p.energy=6;addRep(0.2);if(p.office&&approval(p.office)>=60){p.cp+=50;addRep(0.3);}
  const biz=BIZ.reduce((a,b)=>a+p.biz[b.id]*b.inc,0);p.coins+=biz;
  if(p.office)p.coins+=OFF[typeOf(p.office)].salary;
  if(p.inec)p.coins+=600;
  // projects
  S.projects.forEach(pr=>{pr.left--;if(pr.left<=0){const j=S.jur[pr.k];j[pr.stat]=clamp(j[pr.stat]+pr.gain,0,100);j.mood+=3;if(S.offices[pr.k].isPlayer)addRep(.3);news(`Commissioned: ${pr.label} in ${place(pr.k)}.`);}});
  S.projects=S.projects.filter(pr=>pr.left>0);
  // decay and NPC governance
  allKeys().forEach(k=>{const j=S.jur[k];j.mood*=0.9;STATS.forEach(([s])=>j[s]=clamp(j[s]-0.3,0,100));
    if(!S.offices[k].isPlayer&&Math.random()<.35){const [s]=pick(STATS);j[s]=clamp(j[s]+RI(2,5),0,100);}});
  // monthly allocation
  if(S.day%30===0){allKeys().forEach(k=>{S.jur[k].treasury+=Math.round(OFF[typeOf(k)].alloc*S.allocBoost);});S.allocBoost=1;
    news('FAAC shares the monthly federation allocation.');
    if(p.office&&S.day-(S.lastSalary[p.office]||0)>30){S.jur[p.office].mood-=15;news(`Workers in ${place(p.office)} protest unpaid salaries.`);}}
  // rivals and party growth
  Object.entries(S.elections).forEach(([k,e])=>e.cands.forEach(c=>{if(c.isPlayer){if(p.office===k)c.pop=clamp(c.pop+(approval(k)-50)/40,0,100);}else c.pop=clamp(c.pop+R(0,1.6),0,100);}));
  const mp=party('my');if(mp)mp.members+=Math.round(influence()*R(40,120));
  S.npcs.forEach(n=>n.coins=Math.max(0,Math.round(n.coins*R(.97,1.05)+RI(0,600))));
  // random event
  if(Math.random()<.3){const ev=pick(EVENTS);const s=pick(STATES);news(ev.t.replace('{s}',s.name));
    applyEff(ev.scope==='all'?allKeys():stateKeys(s.id),ev.eff);if(ev.alloc)S.allocBoost=ev.alloc;}
  // INEC bribe offers
  if(p.inec){Object.entries(S.elections).forEach(([k,e])=>{if(e.day===S.day+1&&typeOf(k)!=='LG'&&Math.random()<.7){const c=pick(e.cands.filter(c=>!c.isPlayer));if(c)S.pending.push({type:'bribe',k,partyId:c.partyId,amount:OFF[typeOf(k)].fee*3});}});}
  // elections
  Object.keys(S.elections).forEach(k=>{if(S.elections[k].day===S.day)resolveElection(k);});
  // EFCC
  if(p.scandal>40&&Math.random()<(p.scandal-40)/180){
    const loss=Math.round(p.coins*.3),sl=Math.round(p.stash*.5);p.coins-=loss;p.stash-=sl;
    let extra='';
    if(p.office){const k=p.office;S.offices[k]={name:politician(),partyId:p.partyId,isPlayer:false,until:S.offices[k].until};p.office=null;extra=' You are removed from office.';}
    if(p.race){const e=S.elections[p.race];e.cands=e.cands.filter(c=>!c.isPlayer);p.race=null;extra+=' INEC disqualifies your candidacy.';}
    news(`EFCC operatives raid the home of ${p.name}.`);
    S.pending.push({type:'efcc',text:`EFCC seizes ${fmt(loss+sl)} coins.${extra}`});p.scandal=15;p.integrity=clamp(p.integrity-10,0,100);p.rep*=0.5;
  }
  p.scandal=clamp(p.scandal-0.5,0,100);
  save();render();
}

  const a=b.dataset.a;f(a==='1'?true:a==='0'?false:a);});
document.addEventListener('change',e=>{if(e.target.id==='su-state'){UI.su=e.target.value;const n=val('su-name');render();document.getElementById('su-name').value=n;}});

function start(data){S=(data&&data.player)?data:load();if(S)migrate(S.player);render();}
window.claude?.hot?.snapshot?.(()=>S);
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
